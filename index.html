<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>امتحان: حضارات اليمن القديم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-bg: #010409;
            --primary-glow: #00e5ff; /* Cyan */
            --secondary-glow: #ffffff; /* White */
            --text-color: #e6edf3;
            --surface-color: rgba(13, 17, 23, 0.8);
            --border-color: rgba(0, 229, 255, 0.2);
            --correct-color: #238636;
            --incorrect-color: #da3633;
            --border-radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            /* --- FIX STARTS HERE --- */
            overflow-x: hidden; /* يمنع التمرير الأفقي فقط */
            overflow-y: auto;   /* يسمح بالتمرير العمودي عند الحاجة */
            /* --- FIX ENDS HERE --- */
        }
        /* --- New AI Matrix Background --- */
        #background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .quiz-container {
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: var(--border-radius); box-shadow: 0 0 60px rgba(0, 229, 255, 0.15);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            width: 100%; max-width: 950px; padding: 40px; z-index: 1;
        }
        #block-screen { text-align: center; padding: 80px 40px; }
        #block-screen h1 { font-size: 2.5em; color: var(--incorrect-color); text-shadow: 0 0 10px var(--incorrect-color); margin-bottom: 20px; }
        #block-screen p { font-size: 1.4em; line-height: 1.7; }
        .quiz-header { text-align: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 2px solid var(--border-color); }
        .quiz-header h1 { color: var(--text-color); text-shadow: 0 0 10px var(--primary-glow); font-size: 2.5em; font-weight: 700; }
        #timer {
            background-color: rgba(0, 229, 255, 0.1); border: 1px solid var(--border-color);
            color: var(--primary-glow); padding: 15px; border-radius: 12px; font-size: 1.8em; font-weight: 700;
            text-align: center; margin-bottom: 30px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
            letter-spacing: 3px; text-shadow: 0 0 8px var(--primary-glow);
        }
        #student-info { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 25px; }
        #student-info label { display: block; text-align: center; font-weight: 600; font-size: 1.3em; margin-bottom: 15px; color: var(--primary-glow); }
        #student-name { display: block; width: 80%; margin: 0 auto; padding: 15px; font-size: 1.1em; background-color: rgba(1, 4, 9, 0.8); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-color); text-align: center; transition: all 0.3s ease; }
        #student-name:focus { outline: none; border-color: var(--primary-glow); box-shadow: 0 0 15px var(--primary-glow); }
        
        #start-btn, #submit-btn {
            padding: 20px; font-size: 1.5em; font-weight: 700; color: #010409;
            background: var(--primary-glow);
            border: none; border-radius: 12px; cursor: pointer; transition: all 0.3s ease;
            width: 100%;
        }
        #start-btn { margin-top: 10px; }
        #submit-btn { margin-top: 35px; }
        #start-btn:hover, #submit-btn:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0, 229, 255, 0.3); }
        
        #questions-container { display: flex; flex-direction: column; gap: 35px; }
        .question-block { padding: 25px; background-color: rgba(0,0,0,0.2); border-radius: var(--border-radius); border-left: 5px solid var(--primary-glow); }
        .question-block .level-tag { display: inline-block; background: rgba(0, 229, 255, 0.15); color: var(--primary-glow); padding: 5px 15px; border-radius: 20px; font-size: 0.9em; font-weight: bold; margin-bottom: 15px; }
        .question-text { font-size: 1.2em; font-weight: 600; margin-bottom: 20px; line-height: 1.7; }
        .options { list-style: none; display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 768px) { .options { grid-template-columns: 1fr 1fr; } }
        .options li { background-color: rgba(1, 4, 9, 0.7); border: 1px solid var(--border-color); border-radius: 10px; transition: all 0.2s ease-in-out; }
        .options li:hover { background-color: rgba(0, 229, 255, 0.1); border-color: var(--primary-glow); }
        .options li label { display: block; padding: 15px; cursor: pointer; width: 100%; height: 100%; }
        .options li.selected { background: var(--primary-glow); border-color: var(--primary-glow); color: #010409; font-weight: bold; }
        .options li input[type="radio"] { display: none; }
        
        #results { text-align: center; }
        #results h2 { font-size: 2.5em; text-shadow: 0 0 10px var(--primary-glow); margin-bottom: 20px; }
        #results p { font-size: 1.8em; font-weight: bold; color: var(--text-color); margin-bottom: 20px; }
        .review-question { margin-bottom: 20px; padding: 20px; border-radius: 12px; text-align: right; }
        .review-question.correct { background-color: rgba(35, 134, 54, 0.1); border: 1px solid var(--correct-color); }
        .review-question.incorrect { background-color: rgba(218, 54, 51, 0.1); border: 1px solid var(--incorrect-color); }
        .explanation { margin-top: 15px; padding: 15px; background-color: rgba(0,0,0,0.3); border-radius: 10px; border-right: 3px solid var(--primary-glow); font-size: 0.95em; }

        /* Chatbot Styles */
        #chatbot-toggle {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--primary-glow); color: var(--dark-bg);
            border-radius: 50%; border: none; font-size: 28px; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.4); z-index: 1000; transition: transform 0.3s;
        }
        #chatbot-toggle:hover { transform: scale(1.1); }
        #chatbot-window {
            position: fixed; bottom: 100px; right: 30px; width: 350px; height: 500px;
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: var(--border-radius); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none; flex-direction: column; z-index: 999;
        }
        .chatbot-header { padding: 15px; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .chatbot-header h3 { margin: 0; text-shadow: 0 0 5px var(--primary-glow); }
        #chatbot-close { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        #chatbot-messages { flex-grow: 1; padding: 15px; overflow-y: auto; }
        .chat-message { max-width: 80%; margin-bottom: 12px; padding: 10px 15px; border-radius: 12px; line-height: 1.5; }
        .user-message { background-color: var(--primary-glow); color: var(--dark-bg); margin-left: auto; border-bottom-right-radius: 0; }
        .bot-message { background-color: #333; margin-right: auto; border-bottom-left-radius: 0; }
        .bot-message.error { background-color: var(--incorrect-color); font-weight: bold; }
        #chatbot-input { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        #chatbot-input textarea { flex-grow: 1; resize: none; background: var(--dark-bg); border: 1px solid var(--border-color); border-radius: 8px; color: white; padding: 10px; font-family: inherit; }
        #chatbot-send { background: var(--primary-glow); border: none; border-radius: 8px; color: var(--dark-bg); padding: 0 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="background-animation"></canvas>

    <div class="quiz-container">
        <div id="block-screen" style="display: none;">
            <h1>✋ ممنوع الدخول مرة أخرى</h1>
            <p>لقد قمت بتأدية هذا الامتحان من قبل. لا يُسمح بإعادة الامتحان.</p>
        </div>

        <div id="quiz-main">
            <div class="quiz-header"><h1>امتحان: حضارات اليمن القديم</h1></div>
            <div id="quiz-setup">
                <div id="student-info">
                    <label for="student-name">الرجاء إدخال اسمك الكامل</label>
                    <input type="text" id="student-name" placeholder="الاسم يكتب هنا...">
                </div>
                <button id="start-btn">ابدأ الامتحان</button>
            </div>
            <div id="quiz-live-content" style="display: none;">
                <div id="timer">00:45:00</div>
                <div id="questions-container"></div>
                <button id="submit-btn">تسليم الامتحان</button>
            </div>
            <div id="results" style="display:none;"></div>
        </div>
    </div>

    <button id="chatbot-toggle" style="display: none;">🤖</button>
    <div id="chatbot-window" style="display: none;">
        <div class="chatbot-header">
            <h3 id="chatbot-title">مساعدك "موكوس"</h3>
            <button id="chatbot-close">&times;</button>
        </div>
        <div id="chatbot-messages">
            <div class="chat-message bot-message">أهلاً بك! أنا موكوس. يمكنك أن تسألني 3 أسئلة فقط من الامتحان. الصق السؤال هنا وسأساعدك.</div>
        </div>
        <div id="chatbot-input">
            <textarea id="user-input" placeholder="الصق السؤال هنا..."></textarea>
            <button id="chatbot-send">إرسال</button>
        </div>
    </div>

    <script>
        const EXAM_TOKEN = 'EXAM_ATTEMPTED_YEMEN_CIV_V1';
        if (localStorage.getItem(EXAM_TOKEN)) {
            document.getElementById('quiz-main').style.display = 'none';
            document.getElementById('block-screen').style.display = 'block';
        }

        const fullQuizData = [
            { level: 'سهل', question: "1. ما هي الحضارة التي اتخذت من مدينة \"قرناو\" عاصمة لها؟", options: ["حضارة سبأ", "حضارة حمير", "حضارة معين", "الحضارة المصرية"], answer: "حضارة معين", explanation: "كانت مدينة \"قرناو\" هي عاصمة مملكة معين التي قامت في منطقة الجوف الخصبة." },
            { level: 'سهل', question: "2. أي منشأة هندسية عظيمة تُنسب إلى حضارة سبأ؟", options: ["الأهرامات", "سد مأرب", "حدائق بابل المعلقة", "سور الصين العظيم"], answer: "سد مأرب", explanation: "يُعد سد مأرب من أعظم إنجازات مملكة سبأ الهندسية، وساهم في ازدهار الزراعة بشكل كبير." },
            { level: 'سهل', question: "3. ما اسم الأبجدية التي استخدمها اليمنيون القدماء في كتاباتهم؟", options: ["الهيروغليفية", "المسمارية", "الخط المسند", "الفينيقية"], answer: "الخط المسند", explanation: "هي الأبجدية التي ابتكرها واستخدمها أهل اليمن القديم في نقوشهم وكتاباتهم." },
            { level: 'سهل', question: "4. مَن هي الملكة الشهيرة التي حكمت مملكة سبأ وعاصرت النبي سليمان؟", options: ["حتشبسوت", "بلقيس", "نفرتيتي", "كليوباترا"], answer: "بلقيس", explanation: "الملكة بلقيس هي أشهر حكام مملكة سبأ، وقد ورد ذكر قصتها مع نبي الله سليمان في القرآن الكريم." },
            { level: 'سهل', question: "5. أي نشاط اقتصادي كان يُعد النشاط الرئيسي في بلاد اليمن القديم؟", options: ["الصناعة", "الزراعة", "التجارة", "الرعي"], answer: "التجارة", explanation: "بسبب موقع اليمن الاستراتيجي على طرق التجارة العالمية القديمة، كانت التجارة هي عصب اقتصادها ومصدر ثروتها الرئيسي." },
            { level: 'سهل', question: "6. ما هو العامل الجغرافي الرئيسي الذي ساهم في ازدهار حضارات اليمن؟", options: ["كثرة الأنهار", "الموقع على طرق التجارة", "وجود الصحاري الشاسعة", "الغابات الكثيفة"], answer: "الموقع على طرق التجارة", explanation: "تحكم اليمن في طرق التجارة البرية والبحرية (خاصة طريق البخور) كان العامل الأهم في ازدهارها وتواصلها مع الحضارات الأخرى." },
            { level: 'سهل', question: "7. ما هي المدينة التي أصبحت عاصمة لمملكة حمير؟", options: ["صنعاء", "عدن", "قرناو", "ريدان (ظفار)"], answer: "ريدان (ظفار)", explanation: "بعد سيطرتهم على مناطق سبأ، نقل الحميريون عاصمتهم إلى مدينة \"ريدان\" التي تعرف اليوم باسم \"ظفار\"." },
            { level: 'سهل', question: "8. ما هي المادة التي كانت تستوردها حضارة معين من مصر القديمة؟", options: ["البخور", "الكتان والذهب", "التوابل", "الخشب"], answer: "الكتان والذهب", explanation: "دلت النقوش الأثرية على وجود تبادل تجاري، حيث كانت اليمن تصدّر البخور وتستورد من مصر الكتان لصناعة الملابس والذهب للزينة." },
            { level: 'سهل', question: "9. أي مملكة يمنية تميزت بتوسعها العسكري الكبير؟", options: ["معين", "سبأ", "حمير", "قتبان"], answer: "حمير", explanation: "تميزت مملكة حمير بقوتها العسكرية وتوسعاتها الكبيرة التي شملت معظم مناطق اليمن القديم." },
            { level: 'سهل', question: "10. ماذا كان المعتقد الديني السائد في حضارات اليمن قبل ظهور الديانات السماوية؟", options: ["عبادة الأصنام الحجرية", "عبادة الحيوانات", "عبادة النجوم والكواكب", "عبادة النار"], answer: "عبادة النجوم والكواكب", explanation: "كانت عبادة الأجرام السماوية هي الديانة السائدة، وهو ما يفسر براعتهم في علم الفلك." },
            { level: 'متوسط', question: "11. ما السبب المباشر الذي أدى إلى غزو الأحباش لمملكة حمير؟", options: ["الرغبة في السيطرة على التجارة", "انهيار سد مأرب", "اضطهاد الملك ذونواس للمسيحيين", "طلب من الفرس"], answer: "اضطهاد الملك ذونواس للمسيحيين", explanation: "أدى هذا الاضطهاد الديني إلى تدخل ملك الحبشة (مملكة أكسوم) المسيحي عسكريًا لنجدة مسيحيي اليمن." },
            { level: 'متوسط', question: "12. كيف تكيّف اليمنيون القدماء مع طبيعة أراضيهم الجبلية للزراعة؟", options: ["باستخدام الآلات الزراعية الحديثة", "ببناء المدرجات الجبلية", "بزراعة المحاصيل الصحراوية فقط", "بجلب التربة من مناطق أخرى"], answer: "ببناء المدرجات الجبلية", explanation: "أبدع اليمنيون في تحويل سفوح الجبال إلى مساحات زراعية خصبة عبر بناء المدرجات، وهو حل هندسي عبقري للتغلب على طبيعة الأرض." },
            { level: 'متوسط', question: "13. أي من الحضارات التالية لم تكن على تواصل جغرافي مباشر مع طرق تجارة اليمن القديم؟", options: ["الحضارة المصرية", "حضارة الهند", "حضارات شرق إفريقيا (أكسوم)", "حضارة المايا في أمريكا الوسطى"], answer: "حضارة المايا في أمريكا الوسطى", explanation: "كانت حضارة المايا في قارة أخرى (الأمريكتين) ولم يكن هناك أي تواصل معروف بينها وبين حضارات العالم القديم في تلك الفترة." },
            { level: 'متوسط', question: "14. ما الدور الذي لعبه \"مجلس عام\" في نظام الحكم الملكي اليمني القديم؟", options: ["انتخاب الملك", "إدارة الشؤون الدينية فقط", "مساعدة الملك في إدارة الدولة", "قيادة الجيش في الحروب"], answer: "مساعدة الملك في إدارة الدولة", explanation: "كان \"المجلس العام\" بمثابة هيئة استشارية وحكومية تساعد الملك الوراثي في إدارة شؤون المملكة." },
            { level: 'متوسط', question: "15. يدل وصول الملكة بلقيس إلى حكم سبأ على...", options: ["ضعف الرجال في المجتمع السبئي", "أن نظام الحكم كان ديمقراطيًا", "المكانة المرموقة التي حظيت بها المرأة", "أنها كانت آخر حكام سبأ"], answer: "المكانة المرموقة التي حظيت بها المرأة", explanation: "إن وصول امرأة إلى أعلى منصب في الدولة (ملكة) هو دليل قاطع على أن المرأة كانت تتمتع بحقوق ومكانة اجتماعية وسياسية عالية." },
            { level: 'متوسط', question: "16. ما النتيجتان المترتبتان على انهيار سد مأرب؟", options: ["ازدهار الزراعة وهجرة السكان", "تدهور الزراعة وضعف مملكة سبأ", "تقوية مملكة سبأ وغزو حمير", "بناء سد جديد وتوسع التجارة"], answer: "تدهور الزراعة وضعف مملكة سبأ", explanation: "كان السد هو أساس الزراعة المزدهرة، وانهياره أدى إلى كارثة زراعية واقتصادية أدت بدورها إلى إضعاف المملكة وانهيارها لاحقًا." },
            { level: 'متوسط', question: "17. لماذا برع اليمنيون القدماء في علم الفلك؟", options: ["للتنبؤ بالمستقبل وقراءة الطالع فقط", "لأسباب دينية مرتبطة بعبادة الأجرام السماوية", "لمساعدتهم في الزراعة والملاحة البحرية", "لمنافسة الحضارة المصرية في هذا المجال"], answer: "لمساعدتهم في الزراعة والملاحة البحرية", explanation: "استخدموا الفلك لتحديد مواسم الزراعة بدقة (التقويم السبئي)، ولتوجيه سفنهم التجارية في البحار والمحيطات." },
            { level: 'متوسط', question: "18. ما هو الدور الذي لعبه \"سيف بن ذي يزن\" في تاريخ اليمن؟", options: ["بناء سد مأرب", "توحيد ممالك اليمن لأول مرة", "طلب المساعدة من الفرس لطرد الأحباش", "نشر المسيحية في حمير"], answer: "طلب المساعدة من الفرس لطرد الأحباش", explanation: "بعد فترة من الحكم الحبشي، قاد الأمير الحميري سيف بن ذي يزن المقاومة واستعان بالإمبراطورية الفارسية لطرد الأحباش من اليمن." },
            { level: 'متوسط', question: "19. ما الذي يمكن استنتاجه من وجود قوانين منظمة للضرائب والميراث في حضارة معين؟", options: ["أن المجتمع كان بدائيًا", "وجود نظام دولة متطور ومؤسسات راسخة", "أن التجارة كانت غير مهمة", "أن المجتمع كان يعاني من الفوضى"], answer: "وجود نظام دولة متطور ومؤسسات راسخة", explanation: "إن وجود قوانين تنظم جوانب دقيقة مثل الضرائب والميراث والمعاملات التجارية يدل على وجود جهاز إداري وقضائي متطور، وهي من سمات الدول المتقدمة." },
            { level: 'متوسط', question: "20. ما العامل المشترك بين ضعف مملكة سبأ وسقوط مملكة حمير؟", options: ["الكوارث الطبيعية", "التدخلات العسكرية الخارجية", "الأهمية الاستراتيجية لليمن", "الصراعات الدينية الداخلية"], answer: "الأهمية الاستراتيجية لليمن", explanation: "موقع اليمن الهام أثر على تجارتها (مما أدى لضعف سبأ عند تغير الطرق التجارية)، وجعلها مطمعًا للقوى الخارجية (مما أدى لسقوط حمير بالغزو)." },
            { level: 'صعب', question: "21. أي من العبارات التالية تصف العلاقة بين مملكة حمير وسبأ بشكل أدق؟", options: ["كانتا مملكتين متحالفتين دائمًا", "حمير هي امتداد وتطور لحضارة سبأ", "لم تكن هناك أي علاقة بينهما", "سبأ هي التي قضت على مملكة حمير"], answer: "حمير هي امتداد وتطور لحضارة سبأ", explanation: "الحميريون كانوا فرعًا من السبئيين، وقامت دولتهم على أنقاض مملكة سبأ وورثت الكثير من ملامحها الحضارية، لذا هي تمثل استمرارية وتطورًا لها." },
            { level: 'صعب', question: "22. استخدام اليمنيين لحركة النجوم في الملاحة يدل على وجود تكامل بين...", options: ["العلم والاقتصاد", "الدين والسياسة", "الفن والعمارة", "الزراعة والصناعة"], answer: "العلم والاقتصاد", explanation: "هذا يمثل تطبيقًا عمليًا للمعرفة العلمية (علم الفلك) لخدمة الهدف الاقتصادي الأسمى للدولة وهو التجارة البحرية." },
            { level: 'صعب', question: "23. ما الذي يمثله \"طريق البخور\" بالنسبة لحضارات اليمن القديم؟", options: ["طريق للحج الديني", "مصدر ثانوي للدخل", "شريان اقتصادي عالمي سيطروا عليه", "حدود عسكرية تفصلهم عن الأعداء"], answer: "شريان اقتصادي عالمي سيطروا عليه", explanation: "لم يكن مجرد طريق تجاري، بل كان المصدر الأهم للسلع الفاخرة في العالم القديم، وسيطرة اليمن عليه منحتها نفوذًا وثروة هائلة." },
            { level: 'صعب', question: "24. ما هو الأثر الحضاري الأبعد مدى للأبجدية التي ابتكرها اليمنيون (الخط المسند)؟", options: ["أصبحت أساسًا للأبجدية الأوروبية الحديثة", "ساهمت في تطور الكتابة العربية لاحقًا", "استخدمت لتدوين ملحمة جلجامش", "لم يكن لها أي أثر خارج اليمن"], answer: "ساهمت في تطور الكتابة العربية لاحقًا", explanation: "يرى علماء اللغات أن الخط المسند هو أحد الجذور الرئيسية التي تطورت عنها الأبجدية العربية، مما يجعله ذا أثر بعيد المدى ومستمر." },
            { level: 'صعب', question: "25. يعكس تعاقب الغزو الحبشي ثم الفارسي على اليمن في نهاية تاريخها القديم...", options: ["قوة اليمن العسكرية وقدرتها على الصمود", "انعزال اليمن عن الصراعات العالمية", "وقوعها ضحية للصراع بين القوى الإقليمية الكبرى", "ازدهارها الاقتصادي في تلك الفترة"], answer: "وقوعها ضحية للصراع بين القوى الإقليمية الكبرى", explanation: "في تلك الفترة، كان هناك صراع كبير بين الإمبراطورية البيزنطية (التي دعمت الأحباش) والإم
                ];

        // DOM Elements
        const quizSetupEl = document.getElementById('quiz-setup');
        const quizLiveContentEl = document.getElementById('quiz-live-content');
        const studentNameInput = document.getElementById('student-name');
        const startBtn = document.getElementById('start-btn');
        const questionsContainer = document.getElementById('questions-container');
        const submitBtn = document.getElementById('submit-btn');
        const timerEl = document.getElementById('timer');
        const resultsEl = document.getElementById('results');
        const chatbotToggle = document.getElementById('chatbot-toggle');
        const chatbotWindow = document.getElementById('chatbot-window');
        const chatbotClose = document.getElementById('chatbot-close');
        const chatbotSend = document.getElementById('chatbot-send');
        const userInput = document.getElementById('user-input');
        const messagesContainer = document.getElementById('chatbot-messages');
        const chatbotTitle = document.getElementById('chatbot-title');
        
        // State variables
        let timerInterval;
        let chatUses = 0;
        const MAX_USES = 3;

        function startTimer(duration) {
            let timer = duration;
            timerInterval = setInterval(() => {
                let minutes = Math.floor(timer / 60);
                let seconds = Math.floor(timer % 60);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                timerEl.textContent = `00:${minutes}:${seconds}`;
                if (--timer < 0) {
                    clearInterval(timerInterval);
                    alert("انتهى الوقت! سيتم تسليم إجاباتك الآن.");
                    showResults();
                }
            }, 1000);
        }

        function buildQuiz() {
            let allQuestionsHTML = '';
            fullQuizData.sort(() => Math.random() - 0.5); 

            fullQuizData.forEach((current, index) => {
                const optionsHTML = current.options.map((option, optIndex) => {
                    const optionId = `q${index}o${optIndex}`;
                    return `<li><input type="radio" name="question${index}" id="${optionId}" value="${option}"><label for="${optionId}">${option}</label></li>`;
                }).join('');
                
                allQuestionsHTML += `
                    <div class="question-block">
                        <span class="level-tag">المستوى: ${current.level}</span>
                        <p class="question-text">${current.question}</p>
                        <ul class="options">${optionsHTML}</ul>
                    </div>`;
            });
            questionsContainer.innerHTML = allQuestionsHTML;
            document.querySelectorAll('.options li').forEach(item => {
                item.addEventListener('click', e => {
                    const li = e.currentTarget;
                    li.parentNode.querySelectorAll('li').forEach(sib => sib.classList.remove('selected'));
                    li.classList.add('selected');
                    li.querySelector('input[type="radio"]').checked = true;
                });
            });
        }
        
        function startExam() {
            const studentName = studentNameInput.value.trim();
            if (studentName.length < 3) {
                alert("يجب إدخال اسم ثلاثي على الأقل لبدء الامتحان.");
                return;
            }
            localStorage.setItem(EXAM_TOKEN, JSON.stringify({ name: studentName, device: navigator.userAgent }));
            quizSetupEl.style.display = 'none';
            quizLiveContentEl.style.display = 'block';
            chatbotToggle.style.display = 'flex';
            buildQuiz();
            startTimer(45 * 60); // 45 minutes
        }

        function showResults() {
            clearInterval(timerInterval);
            chatbotToggle.style.display = 'none';
            chatbotWindow.style.display = 'none';
            
            let score = 0;
            const studentAnswers = [];
            fullQuizData.forEach((current, index) => {
                const selector = `input[name="question${index}"]:checked`;
                const userAnswerNode = questionsContainer.querySelector(selector);
                const userAnswer = userAnswerNode ? userAnswerNode.value : undefined;
                studentAnswers.push({ question: current.question, selected: userAnswer, correct: current.answer });

                if (userAnswer === current.answer) { score++; }
            });

            let resultsHTML = `
                <h2>النتيجــــة</h2>
                <p>الطالب: ${JSON.parse(localStorage.getItem(EXAM_TOKEN)).name}</p>
                <p id="final-score">الدرجة النهائية: ${score} من ${fullQuizData.length}</p>
                <h3>مراجعة الإجابات:</h3>`;
            
            fullQuizData.forEach((current) => {
                const userAnswerObj = studentAnswers.find(ans => ans.question === current.question);
                const userAnswer = userAnswerObj ? userAnswerObj.selected : undefined;
                const isCorrect = userAnswer === current.answer;
                resultsHTML += `
                    <div class="review-question ${isCorrect ? 'correct' : 'incorrect'}">
                        <p><strong>السؤال:</strong> ${current.question}</p>
                        <p><strong>إجابتك:</strong> ${userAnswer || "<em>لم تتم الإجابة</em>"}</p>
                        ${!isCorrect ? `<p><strong>الإجابة الصحيحة:</strong> ${current.answer}</p>` : ''}
                        <div class="explanation"><strong>الشرح:</strong> ${current.explanation}</div>
                    </div>`;
            });

            document.getElementById('quiz-live-content').style.display = 'none';
            resultsEl.innerHTML = resultsHTML;
            resultsEl.style.display = 'block';
        }

        function addMessage(text, sender) {
            const messageEl = document.createElement('div');
            messageEl.classList.add('chat-message', `${sender}-message`);
            if (sender === 'bot' && text.includes("موكوس")) { messageEl.classList.add('error'); }
            messageEl.textContent = text;
            messagesContainer.appendChild(messageEl);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function handleUserInput() {
            const userText = userInput.value.trim();
            if (!userText) return;
            addMessage(userText, 'user');
            userInput.value = '';

            if (chatUses >= MAX_USES) {
                addMessage("معرفش حل انت أنا موكوس", 'bot');
                return;
            }

            const foundQuestion = fullQuizData.find(q => userText.includes(q.question.substring(3, 60)));
            
            if (foundQuestion) {
                chatUses++;
                const remaining = MAX_USES - chatUses;
                const botResponse = `الإجابة الصحيحة هي: "${foundQuestion.answer}".\nالشرح: ${foundQuestion.explanation}\n\nتبقى لديك ${remaining} محاولات مساعدة.`;
                addMessage(botResponse, 'bot');
            } else {
                addMessage("لم أتعرف على هذا السؤال. الرجاء نسخ ولصق السؤال بالكامل من الامتحان.", 'bot');
            }
            chatbotTitle.textContent = `مساعدك "موكوس" (${chatUses}/${MAX_USES})`;
            if (chatUses >= MAX_USES) { chatbotTitle.textContent = `"موكوس" خارج الخدمة`; }
        }

        startBtn.addEventListener('click', startExam);
        submitBtn.addEventListener('click', () => {
            const confirmSubmit = confirm("هل أنت متأكد من رغبتك في تسليم الامتحان؟ لا يمكنك العودة بعد ذلك.");
            if (confirmSubmit) { showResults(); }
        });
        
        chatbotToggle.addEventListener('click', () => { chatbotWindow.style.display = chatbotWindow.style.display === 'flex' ? 'none' : 'flex'; });
        chatbotClose.addEventListener('click', () => { chatbotWindow.style.display = 'none'; });
        chatbotSend.addEventListener('click', handleUserInput);
        userInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleUserInput(); }
        });

        // New Background Animation Script
        const canvas = document.getElementById('background-animation');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;

        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x; this.y = y; this.directionX = directionX;
                this.directionY = directionY; this.size = size; this.color = color;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = 'rgba(0, 229, 255, 0.1)';
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) { this.directionX = -this.directionX; }
                if (this.y > canvas.height || this.y < 0) { this.directionY = -this.directionY; }
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 5) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 0.4) - 0.2;
                let directionY = (Math.random() * 0.4) - 0.2;
                particlesArray.push(new Particle(x, y, directionX, directionY, size));
            }
        }

        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                                 + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    if (distance < (canvas.width/7) * (canvas.height/7)) {
                        opacityValue = 1 - (distance/20000);
                        ctx.strokeStyle = `rgba(0, 229, 255, ${opacityValue})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0,0,innerWidth, innerHeight);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }
        
        window.addEventListener('resize', () => {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            init();
        });
        
        init();
        animate();
    </script>
</body>
</html>
